name: Update Forge status

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/mods.json
      - scripts/update-forge-status.mjs
      - .github/workflows/update-forge.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Forge versions
        run: node scripts/update-forge-status.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forge-status.json
          if git diff --staged --quiet; then
            echo "No Forge status changes."
          else
            git commit -m "Update Forge version status"
            git push
          fi
